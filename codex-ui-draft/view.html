<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Interface - Eidos</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css">
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: 'Segoe UI', sans-serif;
        }
        #viewer {
            width: 100%;
            height: 100%;
        }
        .info-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
            color: white;
            z-index: 10;
            pointer-events: none;
        }
        .scene-title {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .watermark {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .marker-custom-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            pointer-events: none;
        }
        .marker-label {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 8px;
            pointer-events: auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .marker-icon-arrow {
            width: 28px;
            height: 28px;
            position: relative;
            pointer-events: auto;
            cursor: pointer;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
            transition: transform 0.2s;
        }
        .marker-icon-arrow::before {
            content: '';
            position: absolute;
            top: 30%;
            left: 50%;
            width: 14px;
            height: 14px;
            border-left: 3px solid #fff;
            border-bottom: 3px solid #fff;
            transform: translate(-50%, -50%) rotate(-45deg);
        }
        .marker-custom-wrapper:hover .marker-icon-arrow {
            transform: translateY(-5px);
        }
        .marker-icon-info {
            width: 28px;
            height: 28px;
            position: relative;
            pointer-events: auto;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border: 2px solid #fff;
            border-radius: 50%;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .marker-icon-info::after {
            content: 'i';
            color: #fff;
            font-weight: bold;
            font-family: serif;
            font-style: italic;
        }
        .marker-custom-wrapper:hover .marker-icon-info {
            transform: scale(1.15);
            background: #3478f6;
            border-color: #3478f6;
        }
        .marker-info {
            width: 220px;
            height: 120px;
            position: relative;
        }
        .marker-info-popover {
            position: absolute;
            bottom: 42px;
            left: 50%;
            width: max-content;
            min-width: 150px;
            max-width: 240px;
            max-height: min(60vh, 420px);
            padding: 10px 12px;
            background: rgba(0,0,0,0.72);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, 8px);
            transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
            pointer-events: auto;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            text-align: left;
        }
        .marker-info-popover::-webkit-scrollbar {
            width: 8px;
        }
        .marker-info-popover::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
        }
        .marker-info-popover::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.42);
            border-radius: 999px;
        }
        .marker-info-popover::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.62);
        }
        .marker-info-popover::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            width: 12px;
            height: 12px;
            background: rgba(0,0,0,0.72);
            border-right: 1px solid rgba(255,255,255,0.18);
            border-bottom: 1px solid rgba(255,255,255,0.18);
            transform: translateX(-50%) rotate(45deg);
        }
        .marker-info:hover .marker-info-popover {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }
        .marker-info-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.35;
        }
        .marker-info-desc {
            margin-top: 6px;
            font-size: 13px;
            line-height: 1.45;
            color: rgba(255,255,255,0.82);
            white-space: pre-wrap;
        }

        #mainSceneBar {
            position: absolute;
            bottom: 270px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 12px;
            border-radius: 30px;
            z-index: 20;
            display: none;
            gap: 10px;
            max-width: 90%;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #mainSceneBar::-webkit-scrollbar {
            display: none;
        }
        .main-scene-pill {
            display: inline-block;
            padding: 6px 18px;
            background: rgba(255,255,255,0.1);
            color: #ccc;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .main-scene-pill:hover {
            background: rgba(255,255,255,0.25);
            color: #fff;
        }
        .main-scene-pill.active {
            background: #3478f6;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(52,120,246,0.6);
            border: 1px solid #3478f6;
        }

        #bottomSceneDock {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            z-index: 20;
            display: none;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            max-height: 76vh;
        }
        #bottomSceneToggle {
            width: 28px;
            height: 42px;
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 999px;
            background: rgba(20, 20, 20, 0.72);
            box-shadow: 0 4px 14px rgba(0,0,0,0.32);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background 0.2s, transform 0.2s;
        }
        #bottomSceneToggle:hover {
            background: rgba(52, 120, 246, 0.9);
            transform: translateX(2px);
        }
        #bottomSceneToggle::before {
            content: '';
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 7px solid #fff;
        }
        #bottomSceneDock:not(.collapsed) #bottomSceneToggle::before {
            border-left: 0;
            border-right: 7px solid #fff;
        }
        #bottomSceneDock:not(.collapsed) #bottomSceneToggle:hover {
            transform: translateX(-2px);
        }
        #bottomSceneBar {
            background: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 70vh;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        #bottomSceneDock.collapsed #bottomSceneBar {
            display: none;
        }
        #bottomSceneBar::-webkit-scrollbar {
            width: 6px;
        }
        #bottomSceneBar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }
        .scene-thumb-item {
            width: 80px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }
        .scene-thumb-item:hover {
            transform: translateX(3px);
        }
        .scene-thumb-img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            border: 2px solid transparent;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .scene-thumb-item.active .scene-thumb-img {
            border-color: #f97316;
        }
        .scene-thumb-label {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            text-align: center;
            font-size: 12px;
            padding: 4px 0;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            pointer-events: none;
        }

        #directionIndicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            width: 140px;
            height: 140px;
            transform: translateX(-50%);
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
        }
        #directionIndicator::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(52, 120, 246, 0.8);
        }
        .compass-pointer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: transform 0.1s linear;
        }
        .compass-pointer svg {
            position: absolute;
            top: -15px;
            left: 50%;
            margin-left: -18px;
            width: 36px;
            height: 36px;
            fill: rgba(255,255,255,0.8);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
            transition: all 0.2s;
            pointer-events: auto;
            cursor: pointer;
        }
        .compass-pointer svg.facing {
            fill: #3478f6;
            filter: drop-shadow(0 0 12px rgba(52,120,246,0.9));
            transform: scale(1.15);
        }
        .compass-pointer svg:hover {
            fill: #f97316;
            filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.9));
            transform: scale(1.3);
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.15s ease, visibility 0.15s ease;
        }
        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .loading-backdrop {
            position: absolute;
            inset: -24px;
            background-size: cover;
            background-position: center;
            filter: blur(18px);
            transform: scale(1.08);
            opacity: 0.62;
            transition: background-image 0.2s ease;
        }
        .loading-overlay::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at center, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.58) 72%),
                linear-gradient(180deg, rgba(0,0,0,0.22), rgba(0,0,0,0.48));
        }
        .loading-content {
            position: relative;
            z-index: 1;
            width: min(280px, 82vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            text-align: center;
            text-shadow: 0 2px 12px rgba(0,0,0,0.65);
        }
        .loading-sphere {
            width: 104px;
            height: 104px;
            position: relative;
            border-radius: 50%;
            background:
                linear-gradient(90deg, transparent 48%, rgba(255,255,255,0.68) 49%, rgba(255,255,255,0.68) 51%, transparent 52%),
                linear-gradient(0deg, transparent 48%, rgba(255,255,255,0.52) 49%, rgba(255,255,255,0.52) 51%, transparent 52%);
            border: 2px solid rgba(255,255,255,0.84);
            box-shadow:
                inset 0 0 18px rgba(96,165,250,0.22),
                0 0 28px rgba(52,120,246,0.44);
            transform-style: preserve-3d;
            animation: loadingWireSphere 2.2s linear infinite;
        }
        .loading-sphere::before {
            content: '';
            position: absolute;
            inset: 13px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.62);
            background:
                linear-gradient(90deg, transparent 47%, rgba(255,255,255,0.42) 48%, rgba(255,255,255,0.42) 52%, transparent 53%),
                linear-gradient(0deg, transparent 47%, rgba(255,255,255,0.35) 48%, rgba(255,255,255,0.35) 52%, transparent 53%);
            transform: rotateY(64deg);
        }
        .loading-sphere::after {
            content: '';
            position: absolute;
            inset: 24px -7px;
            border-radius: 50%;
            border: 1px solid rgba(96,165,250,0.74);
            transform: rotateX(66deg);
            box-shadow: 0 0 16px rgba(96,165,250,0.34);
        }
        .loading-progress {
            width: 100%;
            height: 8px;
            margin-top: 24px;
            border-radius: 999px;
            background: rgba(255,255,255,0.18);
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 8px 24px rgba(0,0,0,0.28);
        }
        .loading-progress-fill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #60a5fa, #ffffff, #34d399);
            box-shadow: 0 0 18px rgba(96,165,250,0.75);
            transition: width 0.08s linear;
        }
        .loading-meta {
            width: 100%;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            gap: 14px;
            font-size: 13px;
            letter-spacing: 0;
            color: rgba(255,255,255,0.88);
        }
        .loading-percent {
            font-variant-numeric: tabular-nums;
        }
        @keyframes loadingWireSphere {
            from { transform: rotateX(-12deg) rotateY(0deg); }
            to { transform: rotateX(-12deg) rotateY(360deg); }
        }

        .custom-modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .custom-modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .custom-modal-box {
            background: #222;
            color: #fff;
            width: 90%;
            max-width: 650px;
            max-height: 80vh;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        .custom-modal-overlay.active .custom-modal-box {
            transform: translateY(0);
        }
        .custom-modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .custom-modal-title {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }
        .custom-modal-close {
            background: transparent;
            border: none;
            color: #999;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }
        .custom-modal-close:hover {
            color: #ef4444;
        }
        .custom-modal-body {
            padding: 25px;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.6;
            color: #ddd;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<div class="info-bar">
    <h1 class="scene-title" id="titleObj">正在加载场景...</h1>
    <div class="watermark">Spatial Interface - Eidos</div>
</div>

<div id="viewer"></div>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-backdrop" id="loadingBackdrop"></div>
    <div class="loading-content">
        <div class="loading-sphere" aria-hidden="true"></div>
        <div class="loading-progress">
            <div class="loading-progress-fill" id="loadingProgressFill"></div>
        </div>
        <div class="loading-meta">
            <span id="loadingText">正在进入场景</span>
            <span class="loading-percent" id="loadingPercent">0%</span>
        </div>
    </div>
</div>
<div id="mainSceneBar"></div>
<div id="bottomSceneDock" class="collapsed">
    <div id="bottomSceneBar"></div>
    <button id="bottomSceneToggle" onclick="window.toggleBottomSceneBar()" title="展开场景列表" aria-label="展开场景列表"></button>
</div>
<div id="directionIndicator"></div>

<div class="custom-modal-overlay" id="infoModalOverlay" onclick="window.closeInfoModal()">
    <div class="custom-modal-box" onclick="event.stopPropagation()">
        <div class="custom-modal-header">
            <h3 class="custom-modal-title" id="infoModalTitle">标题</h3>
            <button class="custom-modal-close" onclick="window.closeInfoModal()">×</button>
        </div>
        <div class="custom-modal-body" id="infoModalDesc">内容描述</div>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://fastly.jsdelivr.net/npm/three/build/three.module.js",
            "@photo-sphere-viewer/core": "https://fastly.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js",
            "@photo-sphere-viewer/markers-plugin": "https://fastly.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.module.js"
        }
    }
</script>
<script type="module">
    import { Cache, Viewer } from '@photo-sphere-viewer/core';
    import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';

    let viewer = null;
    let markersPlugin = null;
    let projectScenes = [];
    let projectMainId = null;
    let currentAreaId = null;
    let isBottomSceneBarOpen = false;
    let loadingProgressTimer = null;
    let loadingAnimationFrame = null;
    let loadingProgressValue = 0;
    let activeLoadingId = 0;
    let loadingShowTimer = null;
    let currentSceneId = null;
    let requestedSceneId = null;
    let activeSwitchId = 0;
    let preloadTimer = null;
    let preloadGeneration = 0;
    let qualityUpgrade = null;
    let currentPanoramaUrl = null;

    const sceneDataCache = new Map();
    const sceneDataRequests = new Map();
    const panoramaDownloads = new Map();
    const SCENE_CACHE_TTL = 5 * 60 * 1000;
    const SCENE_CACHE_LIMIT = 32;
    const ADJACENT_PRELOAD_LIMIT = 2;

    Cache.maxItems = 6;
    Cache.ttl = SCENE_CACHE_TTL / 1000;

    const urlParams = new URLSearchParams(window.location.search);
    const initialSceneId = urlParams.get('id');

    if (!initialSceneId) {
        document.getElementById('titleObj').innerText = "错误：未指定场景 ID";
    } else {
        initApp(initialSceneId);
    }

    const getAreas = () => projectScenes.filter(s => s.id == projectMainId || (s.parent_id == projectMainId && s.is_group == 1));
    const getRooms = (areaId) => projectScenes.filter(s => s.parent_id == areaId && s.is_group == 0);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[ch]));

    window.toggleBottomSceneBar = () => {
        isBottomSceneBarOpen = !isBottomSceneBarOpen;
        updateBottomSceneDockState();
    };

    function updateBottomSceneDockState() {
        const dock = document.getElementById('bottomSceneDock');
        const toggle = document.getElementById('bottomSceneToggle');

        dock.classList.toggle('collapsed', !isBottomSceneBarOpen);
        toggle.title = isBottomSceneBarOpen ? '收起场景列表' : '展开场景列表';
        toggle.setAttribute('aria-label', toggle.title);
    }

    function setLoadingProgress(value) {
        loadingProgressValue = Math.max(0, Math.min(100, value));
        document.getElementById('loadingProgressFill').style.width = `${loadingProgressValue}%`;
        document.getElementById('loadingPercent').innerText = `${Math.round(loadingProgressValue)}%`;
    }

    function showSceneLoading(scene) {
        const loadingId = ++activeLoadingId;
        const overlay = document.getElementById('loadingOverlay');
        const backdrop = document.getElementById('loadingBackdrop');
        const loadingText = document.getElementById('loadingText');
        const previewUrl = scene.thumb_url || scene.image_url || '';

        clearInterval(loadingProgressTimer);
        clearTimeout(loadingShowTimer);
        cancelAnimationFrame(loadingAnimationFrame);
        setLoadingProgress(0);
        loadingText.innerText = '正在进入场景';
        backdrop.style.backgroundImage = previewUrl ? `url("${String(previewUrl).replace(/"/g, '%22')}")` : '';
        // Avoid flashing the full-screen loader on an already cached scene.
        loadingShowTimer = setTimeout(() => {
            if (loadingId === activeLoadingId) overlay.classList.add('active');
        }, currentSceneId === null ? 0 : 300);

        loadingProgressTimer = setInterval(() => {
            const nextValue = loadingProgressValue + Math.max(0.35, (86 - loadingProgressValue) * 0.045);
            setLoadingProgress(Math.min(nextValue, 86));
        }, 90);

        return loadingId;
    }

    function finishSceneLoading(loadingId, failed = false) {
        if (loadingId !== activeLoadingId) return;

        clearInterval(loadingProgressTimer);
        clearTimeout(loadingShowTimer);
        cancelAnimationFrame(loadingAnimationFrame);

        const overlay = document.getElementById('loadingOverlay');
        if (failed || !overlay.classList.contains('active')) {
            overlay.classList.remove('active');
            return;
        }
        const loadingText = document.getElementById('loadingText');
        const startValue = loadingProgressValue;
        const startTime = performance.now();
        const duration = 160;

        loadingText.innerText = '加载完成';

        const animateToComplete = (now) => {
            if (loadingId !== activeLoadingId) return;

            const progress = Math.min((now - startTime) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            setLoadingProgress(startValue + (100 - startValue) * eased);

            if (progress < 1) {
                loadingAnimationFrame = requestAnimationFrame(animateToComplete);
            } else {
                overlay.classList.remove('active');
            }
        };

        loadingAnimationFrame = requestAnimationFrame(animateToComplete);
    }

    function getSceneData(sceneId) {
        const key = String(sceneId);
        const cached = sceneDataCache.get(key);
        if (cached && Date.now() - cached.savedAt < SCENE_CACHE_TTL) {
            sceneDataCache.delete(key);
            sceneDataCache.set(key, cached);
            return Promise.resolve(cached.data);
        }
        sceneDataCache.delete(key);
        if (sceneDataRequests.has(key)) return sceneDataRequests.get(key);

        const request = fetch(`/api/scenes/${encodeURIComponent(key)}`, { cache: 'no-store' })
            .then(async response => {
                if (!response.ok) throw new Error(`Scene request failed: ${response.status}`);
                const data = await response.json();
                if (!data.success || !data.scene || !Array.isArray(data.markers)) {
                    throw new Error('Invalid scene data');
                }
                sceneDataCache.set(key, { data, savedAt: Date.now() });
                if (sceneDataCache.size > SCENE_CACHE_LIMIT) {
                    sceneDataCache.delete(sceneDataCache.keys().next().value);
                }
                return data;
            })
            .finally(() => sceneDataRequests.delete(key));
        sceneDataRequests.set(key, request);
        return request;
    }

    function cancelAdjacentPreload() {
        clearTimeout(preloadTimer);
        preloadGeneration++;
    }

    function getPreviewUrl(scene) {
        return scene.preview_url || `/api/scenes/${encodeURIComponent(scene.id)}/preview`;
    }

    function cancelPanoramaDownloads(keepUrls = []) {
        const keep = new Set(keepUrls);
        for (const [url, task] of panoramaDownloads) {
            if (!keep.has(url)) {
                panoramaDownloads.delete(url);
                task.controller.abort();
            }
        }
    }

    function downloadPanorama(url) {
        if (Cache.get(url, url)) return Promise.resolve();
        if (panoramaDownloads.has(url)) return panoramaDownloads.get(url).promise;

        const controller = new AbortController();
        const task = { controller, promise: null };
        task.promise = fetch(url, { signal: controller.signal })
            .then(response => {
                if (!response.ok) throw new Error(`Panorama request failed: ${response.status}`);
                return response.blob();
            })
            .then(blob => {
                if (controller.signal.aborted) throw new Error('Panorama request cancelled');
                Cache.add(url, url, blob);
            })
            .finally(() => {
                if (panoramaDownloads.get(url) === task) panoramaDownloads.delete(url);
            });
        panoramaDownloads.set(url, task);
        return task.promise;
    }

    async function upgradePanoramaQuality(scene, switchId) {
        try {
            // Download first, so view changes made during loading remain untouched.
            await downloadPanorama(scene.image_url);
            if (switchId !== activeSwitchId || currentSceneId !== String(scene.id)) return;
            const previewData = viewer.state.textureData.panoData;
            const completed = await viewer.setPanorama(scene.image_url, {
                showLoader: false,
                transition: { speed: 180, rotation: false, effect: 'fade' },
                // Carry over projection/pose, but never reapply an initial camera view.
                panoData: image => {
                    const scaleX = image.width / previewData.croppedWidth;
                    const scaleY = image.height / previewData.croppedHeight;
                    return {
                        ...previewData,
                        fullWidth: Math.round(previewData.fullWidth * scaleX),
                        fullHeight: Math.round(previewData.fullHeight * scaleY),
                        croppedWidth: image.width,
                        croppedHeight: image.height,
                        croppedX: Math.round(previewData.croppedX * scaleX),
                        croppedY: Math.round(previewData.croppedY * scaleY),
                        initialHeading: null, initialPitch: null, initialFov: null
                    };
                }
            });
            if (completed && switchId === activeSwitchId) currentPanoramaUrl = scene.image_url;
        } catch (error) {
            if (switchId !== activeSwitchId) return;
            Cache.remove(scene.image_url, scene.image_url);
            viewer.hideError();
            console.warn('Keeping preview; full panorama unavailable:', error.message);
        }
    }

    function scheduleAdjacentPreload(scene, markers) {
        cancelAdjacentPreload();
        const connection = navigator.connection;
        if (connection?.saveData || /(^|-)2g$/.test(connection?.effectiveType || '')) return;

        const linkedIds = [...new Set(markers
            .filter(marker => marker.target_scene_id)
            .map(marker => String(marker.target_scene_id)))];
        const candidates = linkedIds
            .map(id => projectScenes.find(item => String(item.id) === id))
            .filter(item => item && item.id != scene.id && item.image_url)
            .slice(0, ADJACENT_PRELOAD_LIMIT);
        const generation = preloadGeneration;

        // Warm both small previews before spending bandwidth on full panoramas.
        preloadTimer = setTimeout(async () => {
            for (const previewOnly of [true, false]) {
                for (const target of candidates) {
                    if (generation !== preloadGeneration || requestedSceneId !== null) return;
                    if (previewOnly) getSceneData(target.id).catch(() => {});
                    if (Cache.get(target.image_url, target.image_url)) continue;
                    const url = previewOnly ? getPreviewUrl(target) : target.image_url;
                    await downloadPanorama(url).catch(() => {});
                }
            }
        }, 600);
    }

    window.addEventListener('wheel', (e) => {
        const scrollBox = e.target.closest?.('.marker-info-popover, #bottomSceneBar');

        if (!scrollBox) return;

        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();

        const canScrollY = scrollBox.scrollHeight > scrollBox.clientHeight;
        const canScrollX = scrollBox.scrollWidth > scrollBox.clientWidth;

        if (!canScrollY && !canScrollX) return;

        const wheelDelta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;

        if (canScrollY) {
            scrollBox.scrollTop += wheelDelta;
        } else {
            scrollBox.scrollLeft += wheelDelta;
        }
    }, { capture: true, passive: false });

    async function initApp(startId) {
        try {
            const r = await fetch(`/api/scenes-tree/${startId}`);
            const data = await r.json();

            if (!data.success) {
                return document.getElementById('titleObj').innerText = "场景已被删除或不存在";
            }

            projectMainId = data.projectMainId;
            projectScenes = data.scenes;
            await window.switchToScene(startId, true);
        } catch (err) {
            document.getElementById('titleObj').innerText = "网络加载异常";
        }
    }

    window.switchToScene = async (targetId, isFirstLoad = false) => {
        const sceneKey = String(targetId);
        if (sceneKey === requestedSceneId || (sceneKey === currentSceneId && requestedSceneId === null)) return;

        const titleEl = document.getElementById('titleObj');
        const switchId = ++activeSwitchId;
        requestedSceneId = sceneKey;
        cancelAdjacentPreload();
        let loadingId = null;
        titleEl.innerText = "正在穿越...";

        try {
            const targetScene = projectScenes.find(s => s.id == targetId);
            if (!targetScene?.image_url) throw new Error('Scene not found');
            const previewUrl = getPreviewUrl(targetScene);
            cancelPanoramaDownloads([previewUrl, targetScene.image_url]);
            loadingId = showSceneLoading(targetScene);
            if (!viewer) {
                viewer = new Viewer({
                    container: document.querySelector('#viewer'),
                    defaultZoomLvl: 0,
                    navbar: [
                        'autorotate',
                        'zoom',
                        {
                            id: 'download',
                            title: '下载原图',
                            content: '<svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:currentColor; transform: translateY(2px);"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>',
                            onClick: () => {
                                const scene = projectScenes.find(item => String(item.id) === currentSceneId);
                                if (!scene) return;
                                const old = titleEl.innerText;
                                titleEl.innerText = "⬇️ 正在拉取原图...";
                                fetch(scene.original_url || scene.image_url)
                                    .then(r => r.blob())
                                    .then(b => {
                                        const url = URL.createObjectURL(b);
                                        const a = document.createElement('a');
                                        a.href = url;
                                        a.download = scene.title + '.jpg';
                                        document.body.appendChild(a);
                                        a.click();
                                        URL.revokeObjectURL(url);
                                        a.remove();
                                        titleEl.innerText = old;
                                    });
                            }
                        },
                        'fullscreen'
                    ],
                    plugins: [[MarkersPlugin, { markers: [] }]]
                });
                markersPlugin = viewer.getPlugin(MarkersPlugin);
                markersPlugin.addEventListener('select-marker', (e, marker) => {
                    const m = marker || e.marker;
                    if (m.data.targetId) window.switchToScene(m.data.targetId);
                });
            }

            const panoramaReady = (async () => {
                const initialUrl = Cache.get(targetScene.image_url, targetScene.image_url)
                    ? targetScene.image_url : previewUrl;
                const options = {
                    showLoader: false,
                    transition: isFirstLoad || currentSceneId === null
                        ? false
                        : { speed: 250, rotation: false, effect: 'fade' }
                };
                try {
                    const pending = panoramaDownloads.get(initialUrl);
                    if (pending) await pending.promise;
                    if (switchId !== activeSwitchId) return { completed: false };
                    const completed = await viewer.setPanorama(initialUrl, options);
                    return { completed, url: initialUrl };
                } catch (error) {
                    if (initialUrl === targetScene.image_url || switchId !== activeSwitchId) throw error;
                    // Old deployments or missing previews still load the existing image.
                    const pending = panoramaDownloads.get(targetScene.image_url);
                    if (pending) await pending.promise;
                    if (switchId !== activeSwitchId) return { completed: false };
                    const completed = await viewer.setPanorama(targetScene.image_url, options);
                    return { completed, url: targetScene.image_url };
                }
            })();
            const [sceneResult, panoramaResult] = await Promise.allSettled([
                getSceneData(targetId), panoramaReady
            ]);
            if (switchId !== activeSwitchId) return;
            if (sceneResult.status === 'rejected') throw sceneResult.reason;
            if (panoramaResult.status === 'rejected') throw panoramaResult.reason;
            if (!panoramaResult.value.completed) throw new Error('Panorama loading interrupted');
            const mData = sceneResult.value;

            const formattedMarkers = mData.markers.map(m => {
                let targetName = m.title;
                const isArrow = m.target_scene_id !== null && m.target_scene_id !== 0;

                if (isArrow) {
                    const ts = projectScenes.find(s => s.id == m.target_scene_id);
                    if (ts) targetName = ts.title;
                }

                const safeTitle = escapeHtml(m.title);
                const safeDesc = escapeHtml(m.description);
                const markerHtml = isArrow
                    ? `
                        <div class="marker-custom-wrapper marker-jump">
                            <div class="marker-label">${escapeHtml(targetName)}</div>
                            <div class="marker-icon-arrow"></div>
                        </div>`
                    : `
                        <div class="marker-custom-wrapper marker-info">
                            <div class="marker-info-popover">
                                <div class="marker-info-title">${safeTitle}</div>
                                ${safeDesc ? `<div class="marker-info-desc">${safeDesc}</div>` : ''}
                            </div>
                            <div class="marker-icon-info"></div>
                        </div>`;

                return {
                    id: `m-${m.id}`,
                    position: { yaw: parseFloat(m.yaw), pitch: parseFloat(m.pitch) },
                    html: markerHtml,
                    size: isArrow ? { width: 80, height: 50 } : { width: 220, height: 120 },
                    anchor: 'bottom center',
                    tooltip: isArrow ? { content: m.title } : undefined,
                    data: { targetId: m.target_scene_id, desc: m.description, title: m.title }
                };
            });

            markersPlugin.setMarkers(formattedMarkers);
            currentSceneId = sceneKey;
            currentPanoramaUrl = panoramaResult.value.url;
            requestedSceneId = null;
            titleEl.innerText = targetScene.title || '全景漫游';
            currentAreaId = (targetScene.is_group || targetScene.id == projectMainId) ? targetScene.id : targetScene.parent_id;
            renderMainSceneBar();
            renderBottomBar(targetId);

            const jumpMarkers = formattedMarkers.filter(m => m.data.targetId);
            const indicatorContainer = document.getElementById('directionIndicator');
            if (window.currentCompassTracker) {
                viewer.removeEventListener('position-updated', window.currentCompassTracker);
                window.currentCompassTracker = null;
            }

            if (jumpMarkers.length > 0) {
                indicatorContainer.style.opacity = '1';
                indicatorContainer.innerHTML = '';

                const pointers = jumpMarkers.map(marker => {
                    const ptr = document.createElement('div');
                    ptr.className = 'compass-pointer';
                    ptr.onclick = () => window.switchToScene(marker.data.targetId);
                    ptr.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <title>前往: ${marker.tooltip.content}</title>
                            <path d="M12 2L4 20l8-3 8 3z"/>
                        </svg>`;
                    indicatorContainer.appendChild(ptr);
                    return { element: ptr, targetYaw: marker.position.yaw };
                });

                window.currentCompassTracker = () => {
                    const currentYaw = viewer.getPosition().yaw;
                    pointers.forEach(p => {
                        let diff = p.targetYaw - currentYaw;
                        while (diff <= -Math.PI) diff += 2 * Math.PI;
                        while (diff > Math.PI) diff -= 2 * Math.PI;

                        p.element.style.transform = `rotate(${diff * (180 / Math.PI)}deg)`;
                        const svg = p.element.querySelector('svg');

                        if (Math.abs(diff) < 0.3) {
                            svg.classList.add('facing');
                        } else {
                            svg.classList.remove('facing');
                        }
                    });
                };

                viewer.addEventListener('position-updated', window.currentCompassTracker);
                window.currentCompassTracker();
            } else {
                indicatorContainer.style.opacity = '0';
                indicatorContainer.innerHTML = '';
            }
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            if (switchId !== activeSwitchId) return;
            finishSceneLoading(loadingId);
            if (currentPanoramaUrl !== targetScene.image_url) {
                const task = { promise: null };
                task.promise = upgradePanoramaQuality(targetScene, switchId).finally(() => {
                    if (qualityUpgrade === task) qualityUpgrade = null;
                    if (switchId === activeSwitchId && requestedSceneId === null) {
                        scheduleAdjacentPreload(targetScene, mData.markers);
                    }
                });
                qualityUpgrade = task;
            } else {
                scheduleAdjacentPreload(targetScene, mData.markers);
            }
        } catch(e) {
            if (switchId !== activeSwitchId) return;
            currentSceneId = null;
            currentPanoramaUrl = null;
            cancelPanoramaDownloads();
            finishSceneLoading(loadingId ?? activeLoadingId, true);
            if (markersPlugin) markersPlugin.clearMarkers();
            if (window.currentCompassTracker) {
                viewer.removeEventListener('position-updated', window.currentCompassTracker);
                window.currentCompassTracker = null;
            }
            document.getElementById('directionIndicator').style.opacity = '0';
            titleEl.innerText = "场景切换失败";
            console.error('Scene switch failed:', e);
        } finally {
            if (switchId === activeSwitchId) requestedSceneId = null;
        }
    };

    function renderMainSceneBar() {
        const bar = document.getElementById('mainSceneBar');
        const areas = getAreas();

        if (areas.length <= 1) {
            bar.style.display = 'none';
            return;
        }

        bar.innerHTML = areas.map(s => `
            <div class="main-scene-pill ${s.id == currentAreaId ? 'active' : ''}" onclick="window.switchToScene(${s.id})">
                ${s.title}
            </div>
        `).join('');
        bar.style.display = 'block';
    }

    function renderBottomBar(activeId) {
        const dock = document.getElementById('bottomSceneDock');
        const bottomBar = document.getElementById('bottomSceneBar');
        const rooms = getRooms(currentAreaId);

        bottomBar.innerHTML = rooms.map(s => `
            <div class="scene-thumb-item ${s.id == activeId ? 'active' : ''}" onclick="window.switchToScene(${s.id})">
                <img src="${s.thumb_url || s.image_url}" class="scene-thumb-img" loading="lazy" decoding="async">
                <div class="scene-thumb-label">${s.title}</div>
            </div>
        `).join('');

        dock.style.display = rooms.length > 0 ? 'flex' : 'none';
        updateBottomSceneDockState();
    }

    window.showInfoModal = (title, desc) => {
        document.getElementById('infoModalTitle').innerText = title;
        document.getElementById('infoModalDesc').innerText = desc;
        const o = document.getElementById('infoModalOverlay');
        o.style.display = 'flex';
        setTimeout(() => o.classList.add('active'), 10);
    };

    window.closeInfoModal = () => {
        const o = document.getElementById('infoModalOverlay');
        o.classList.remove('active');
        setTimeout(() => o.style.display = 'none', 300);
    };
</script>
</body>

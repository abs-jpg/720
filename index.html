<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Spatial Interface - Eidos</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css">
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.css">
    <style>
        /* --- 屏幕正中央的弹窗样式 --- */
        .center-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5); /* 半透明黑底 */
            backdrop-filter: blur(4px); /* 背景模糊效果 */
            z-index: 99999; /* 保证在最最顶层 */
            display: none; /* 默认隐藏 */
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .center-modal-overlay.show {
            display: flex;
            opacity: 1;
        }
        .center-modal-box {
            background: #fff;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            transform: translateY(-20px);
            transition: transform 0.2s ease;
            text-align: center; /* 文字居中 */
        }
        .center-modal-overlay.show .center-modal-box {
            transform: translateY(0); /* 弹出的微小动画 */
        }
        .center-modal-header {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
        }
        .center-modal-body {
            padding: 30px 20px;
            font-size: 15px;
            color: #666;
            line-height: 1.5;
        }
        .center-modal-footer {
            padding: 15px;
            background: #f9fafb;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        :root {
            --primary-color: #3478f6;
            --primary-hover: #2868d6;
            --bg-color: #f6f8fc;
            --text-color: #333;
            --sidebar-bg: #fff;
            --border-color: #e9ecef;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            overflow-x: hidden;
        }
        .header {
            background-color: #fff;
            padding: 0px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.03);
            height: 70px;
            border-bottom: 1px solid #eee;
            position: relative;
            z-index: 100;
        }
        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
            height: 100%;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #111;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .lang-select {
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            color: #555;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }
        .nav-link {
            position: relative;
            display: flex;
            align-items: center;
            height: 100%;
            padding: 0 20px;
            color: #666;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
        }
        .nav-link .underline {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0%;
            height: 3px;
            background-color: var(--primary-color);
            transition: width 0.3s;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--primary-color);
        }
        .nav-link:hover .underline, .nav-link.active .underline {
            width: 100%;
        }
        #galleryView {
            display: block;
        }
        #editorView {
            display: none;
            height: calc(100vh - 70px);
            flex-direction: row;
        }
        .page-header-container {
            padding: 40px 50px 10px 50px;
            background-color: var(--bg-color);
        }
        .discover-title {
            margin: 0;
            font-size: 26px;
            font-weight: 600;
            color: #333;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            padding: 20px 50px 50px 50px;
        }
        .card {
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            cursor: pointer;
            border: 1px solid #f0f0f0;
            position: relative;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .card-img-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .card:hover .card-img {
            transform: scale(1.03);
        }
        .card-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .card-title {
            margin: 0 0 12px 0;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.3;
        }
        .badge {
            font-size: 13px;
            font-weight: bold;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
        }
        .badge-published {
            background-color: var(--primary-color);
            color: white;
        }
        .badge-draft {
            background-color: #10b981;
            color: white;
        }
        .card-time {
            margin: 0;
            font-size: 13px;
            color: #999;
        }
        .card-overlay-actions {
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            transition: bottom 0.25s;
            z-index: 10;
        }
        .card:hover .card-overlay-actions {
            bottom: 0;
        }
        .card-btn {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            color: white;
        }
        .btn-edit-card {
            background-color: var(--primary-color);
        }
        .btn-delete-card {
            background-color: #ef4444;
        }
        .main-content {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e9ecef;
        }
        #viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        #viewer.active {
            opacity: 1;
            pointer-events: auto;
        }
        .upload-box {
            text-align: center;
            color: #555;
            background: #fff;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            z-index: 10;
            border: 1px dashed #ccc;
        }
        .upload-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 15px;
            margin-top: 15px;
            font-weight: bold;
        }
        #sidebar {
            width: 340px;
            background: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .tab-header {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            padding: 0 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 18px 0;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            font-weight: 600;
            position: relative;
            transition: 0.2s;
        }
        .tab-btn.active {
            color: var(--primary-color);
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--primary-color);
        }
        .tab-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }
        .panel-container {
            display: none;
        }
        .panel-container.active {
            display: block;
        }
        .panel-group {
            margin-bottom: 22px;
        }
        .panel-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #555;
            font-weight: 600;
        }
        .panel-group input[type="text"],
        .panel-group textarea,
        .panel-group select {
            width: 100%;
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .pro-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .btn-outline {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            transition: all 0.2s ease;
        }
        .btn-outline:hover {
            background-color: #f0f4ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52,120,246,0.15);
        }
        .btn-danger {
            background-color: #fef2f2;
            color: #ef4444;
            border: 1px solid #fecaca;
        }

        .thumb-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .thumb-item {
            width: 85px;
            height: 60px;
            border-radius: 6px;
            border: 2px solid transparent;
            position: relative;
            cursor: pointer;
            background: #ddd;
            transition: border-color 0.2s;
        }
        .thumb-item.active {
            border-color: var(--primary-color);
        }
        .thumb-item img {
            border-radius: 4px;
        }
        .thumb-item span {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            font-size: 10px;
            text-align: center;
            padding: 3px;
            color: white;
            z-index: 2;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            pointer-events: none;
        }
        .btn-delete-thumb {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            text-align: center;
            font-size: 12px;
            line-height: 16px;
            z-index: 10;
            transition: transform 0.2s;
        }
        .btn-delete-thumb:hover {
            transform: scale(1.2);
        }

        #editingBar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            color: #333;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-weight: bold;
        }
        #placementTip {
            display: none;
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            font-weight: bold;
        }
        .marker-custom-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            pointer-events: none;
        }
        .marker-label {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            pointer-events: auto;
        }
        .marker-icon-arrow {
            width: 28px;
            height: 28px;
            position: relative;
            pointer-events: auto;
            cursor: pointer;
        }
        .marker-icon-arrow::before {
            content: '';
            position: absolute;
            top: 30%;
            left: 50%;
            width: 14px;
            height: 14px;
            border-left: 3px solid #fff;
            border-bottom: 3px solid #fff;
            transform: translate(-50%, -50%) rotate(-45deg);
        }
        .marker-icon-info {
            width: 28px;
            height: 28px;
            position: relative;
            background: rgba(255,255,255,0.2);
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            cursor: pointer;
        }
        .marker-icon-info::after {
            content: 'i';
            color: #fff;
            font-weight: bold;
            font-family: serif;
            font-style: italic;
        }
        .marker-icon-temp {
            width: 30px;
            height: 30px;
            background: rgba(52, 120, 246, 0.3);
            border: 2px dashed var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .marker-icon-temp::after {
            content: '+';
            color: var(--primary-color);
            font-weight: 900;
            font-size: 20px;
        }
    </style>
</head>
<body>


<iframe id="previewIframe" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:9000; border:none; background:#111;"></iframe>
<button id="exitPreviewBtn" onclick="exitPreviewMode()" style="display:none; position:fixed; top:30px; left:50%; transform:translateX(-50%); z-index:9999; padding:12px 30px; background:rgba(0,0,0,0.7); color:white; border:none; border-radius:30px; font-weight:bold; cursor:pointer; backdrop-filter:blur(8px); box-shadow:0 4px 20px rgba(0,0,0,0.4); font-size: 15px; transition: background 0.2s;">
    🔙 退出预览，返回制作
</button>
<div class="header">
    <div class="nav-links">
        <button class="nav-link active" id="navGallery" onclick="switchView('gallery')">
            作品展示<span class="underline"></span>
        </button>
        <button class="nav-link" id="navMyWorks" onclick="switchView('myWorks')">
            我的作品<span class="underline"></span>
        </button>
        <button class="nav-link" id="navEditor" onclick="switchView('editor')">
            开始制作<span class="underline"></span>
        </button>
    </div>
    <div class="header-right">
        <select class="lang-select" id="langSelect">
            <option value="zh" selected>🇨🇳 中文</option>
            <option value="en">🇺🇸 EN</option>
        </select>
    </div>
</div>

<div id="galleryView">
    <div class="page-header-container">
        <h2 class="discover-title" id="galleryTitle">发现了全景视界</h2>
    </div>
    <div class="gallery" id="gallery"></div>
</div>

<div id="editorView">
    <div class="main-content">
        <div id="editingBar"><span id="editingName">主场景</span></div>
        <div class="upload-box" id="uploadBox">
            <h2 style="margin-top:0;">开启全景项目</h2>
            <p style="color:#666; margin-bottom:20px;">请先上传一张作为封面的【全局鸟瞰/大门照片】</p>
            <input type="file" id="mainFileInput" accept="image/jpeg, image/png" style="display:none;" onchange="handleMainUpload()">
            <button class="upload-btn" onclick="document.getElementById('mainFileInput').click()">+ 上传项目封面</button>
        </div>
        <div id="viewer"></div>
        <div id="placementTip">📍 请单击画面放置标记</div>
    </div>

    <div id="sidebar">
        <div class="tab-header">
            <button class="tab-btn active" id="tabProps" onclick="switchSidebarPanel('props')">项目属性</button>
            <button class="tab-btn" id="tabMarker" onclick="switchSidebarPanel('marker')">标记配置</button>
        </div>
        <div class="tab-content">
            <div class="panel-container active" id="propsPanel">
                <div class="panel-group">
                    <label id="dynamicSceneLabel">当前视角主场景名称</label>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="sceneTitle" placeholder="起个名字" style="flex:1;">
                        <button class="pro-btn" style="width:70px; margin-bottom:0; padding:12px 0;" onclick="saveSceneInfo()">保存</button>
                        <button class="pro-btn btn-danger" style="width:70px; margin-bottom:0; padding:12px 0;" onclick="discardProject()">放弃</button>
                    </div>
                    <button class="pro-btn btn-outline" style="margin-top:15px; display:flex; justify-content:center; align-items:center; gap:8px;" onclick="enterPreviewMode()">👁️ 全屏预览当前效果</button>
                </div>

                <div class="panel-group" id="subScenePanel" style="display:none; margin-top:30px;">
                    <label style="border-bottom: 1px solid #eee; padding-bottom: 8px;">主场景管理</label>
                    <div id="mainSceneList" style="display:flex; gap:8px; overflow-x:auto; margin:12px 0; padding-bottom:5px;"></div>
                    <input type="file" id="newAreaFileInput" accept="image/jpeg, image/png" style="display:none;" onchange="handleAreaUpload()">
                    <button class="pro-btn btn-outline" style="margin-bottom:25px;" onclick="document.getElementById('newAreaFileInput').click()">+ 添加主场景</button>

                    <label style="border-bottom: 1px solid #eee; padding-bottom: 8px;">副场景管理</label>
                    <input type="file" id="subFileInput" accept="image/jpeg, image/png" style="display:none;" onchange="handleSubUpload()">
                    <button class="pro-btn btn-outline" style="margin-top:10px;" onclick="document.getElementById('subFileInput').click()">+ 添加副场景</button>
                    <div class="thumb-list" id="thumbList"></div>
                </div>
            </div>

            <div class="panel-container" id="markerPanel">
                <div id="markerDefaultState">
                    <button class="pro-btn btn-outline" onclick="enableMarkerPlacement()">+ 在画面中添加新标记</button>
                    <p style="font-size: 13px; color: #888; margin-top:15px; background:#f8f9fa; padding:10px; border-radius:6px;">
                        💡 <b>打点说明：</b><br>
                        1. 点击上方按钮，在画面中单击放置。<br>
                        2. 在下方填写内容。<br>
                        3. 点击【保存】完成。<br>
                        4. 点击已有标记可修改。
                    </p>
                </div>
                <div id="markerEditState" style="display:none;">
                    <div class="panel-group">
                        <label>标记类型</label>
                        <select id="proMarkerType" onchange="toggleProMarkerFields()">
                            <option value="info">📍 图文详情点</option>
                            <option value="arrow">⬆️ 场景跳转点</option>
                        </select>
                    </div>
                    <div class="panel-group">
                        <label>显示标题</label>
                        <input type="text" id="proMarkerTitle">
                    </div>
                    <div class="panel-group" id="proMarkerFieldDesc">
                        <label>详细描述</label>
                        <textarea id="proMarkerDesc"></textarea>
                    </div>
                    <div class="panel-group" id="proMarkerFieldTarget" style="display:none;">
                        <label>目标跳转房间</label>
                        <select id="proMarkerTarget"></select>
                    </div>
                    <div style="margin-top: 30px; display:flex; flex-direction:column; gap:10px;">
                        <button class="pro-btn" onclick="saveMarkerPro()">✅ 保存标记设置</button>
                        <button class="pro-btn btn-danger" id="btnDeleteMarker" onclick="deleteMarkerPro()">🗑️ 删除此标记</button>
                        <button class="pro-btn" style="background:#f1f3f5; color:#555;" onclick="cancelMarkerEdit()">取消返回</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://fastly.jsdelivr.net/npm/three/build/three.module.js",
            "@photo-sphere-viewer/core": "https://fastly.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js",
            "@photo-sphere-viewer/markers-plugin": "https://fastly.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.module.js"
        }
    }
</script>
<script type="module">
    import { Viewer } from '@photo-sphere-viewer/core';
    import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';

    let ownerId = localStorage.getItem('panoOwnerId');
    if (!ownerId) {
        ownerId = 'user_' + Date.now() + Math.random().toString(16).slice(2);
        localStorage.setItem('panoOwnerId', ownerId);
    }

    let viewer = null;
    let markersPlugin = null;
    let projectScenes = [];
    let projectMainId = null;
    let currentAreaId = null;
    let editingSceneId = null;
    let currentlyEditingMarkerData = null;
    let isPlacingMarkerMode = false;
    let tempMarkerPos = null;

    const i18n = {
        zh: { draft: "草稿", published: "已发布" },
        en: { draft: "Draft", published: "Pub" }
    };

    function formatTime(timeStr) {
        return timeStr ? new Date(timeStr).toLocaleString().replace(/\//g, '-') : '刚刚';
    }

    // 【全局暴露：确保 HTML onClick 绝对能调用的函数】
    Object.assign(i18n, {
        zh: {
            navGallery: '作品展示',
            navMyWorks: '我的作品',
            navEditor: '开始制作',
            galleryTitle: '发现全景视界',
            uploadTitle: '开启全景项目',
            uploadDesc: '请先上传一张作为封面的全景图或入口照片',
            uploadMain: '+ 上传项目封面',
            propsTab: '项目属性',
            markerTab: '标记配置',
            currentMainName: '当前视角主场景名称',
            currentSubName: '当前视角副场景名称',
            sceneTitlePlaceholder: '起个名字',
            save: '保存',

    const getLang = () => document.getElementById('langSelect').value || 'zh';
    const text = (key) => i18n[getLang()][key] || i18n.zh[key] || key;
    const formatDisplayTime = (timeStr) => timeStr ? new Date(timeStr).toLocaleString(getLang() === 'en' ? 'en-US' : 'zh-CN').replace(/\//g, '-') : (getLang() === 'en' ? 'Just now' : '刚刚');

    function setText(selector, value) {
        const el = document.querySelector(selector);
        if (el) el.innerText = value;
    }

    function setHtml(selector, value) {
        const el = document.querySelector(selector);
        if (el) el.innerHTML = value;
    }

    function applyLanguage() {
        document.documentElement.lang = getLang() === 'en' ? 'en' : 'zh-CN';
        const langSelect = document.getElementById('langSelect');
        langSelect.options[0].text = '🇨🇳 中文';
        langSelect.options[1].text = '🇺🇸 EN';
        setHtml('#navGallery', `${text('navGallery')}<span class="underline"></span>`);
        setHtml('#navMyWorks', `${text('navMyWorks')}<span class="underline"></span>`);
        setHtml('#navEditor', `${text('navEditor')}<span class="underline"></span>`);
        setText('#galleryTitle', text('galleryTitle'));
        setText('#uploadBox h2', text('uploadTitle'));
        setText('#uploadBox p', text('uploadDesc'));
        setText('#uploadBox .upload-btn', text('uploadMain'));
        setText('#tabProps', text('propsTab'));
        setText('#tabMarker', text('markerTab'));
        document.getElementById('sceneTitle').placeholder = text('sceneTitlePlaceholder');
        setText('button[onclick="saveSceneInfo()"]', text('save'));
        setText('button[onclick="discardProject()"]', text('discard'));
        setText('button[onclick="enterPreviewMode()"]', text('preview'));
        setText("button[onclick=\"document.getElementById('newAreaFileInput').click()\"]", text('addMainScene'));
        setText("button[onclick=\"document.getElementById('subFileInput').click()\"]", text('addSubScene'));
        setText('button[onclick="enableMarkerPlacement()"]', text('addMarker'));
        setHtml('#markerDefaultState p', text('markerHelp'));
        setText('button[onclick="saveMarkerPro()"]', text('saveMarker'));
        setText('#btnDeleteMarker', text('deleteMarker'));
        setText('button[onclick="cancelMarkerEdit()"]', text('cancelBack'));

        const panelLabels = document.querySelectorAll('#propsPanel label, #markerPanel label');
        if (panelLabels[1]) panelLabels[1].innerText = text('mainSceneManage');
        if (panelLabels[2]) panelLabels[2].innerText = text('subSceneManage');
        if (panelLabels[3]) panelLabels[3].innerText = text('markerType');
        if (panelLabels[4]) panelLabels[4].innerText = text('markerTitle');
        if (panelLabels[5]) panelLabels[5].innerText = text('markerDesc');
        if (panelLabels[6]) panelLabels[6].innerText = text('markerTarget');

        if (markerType) {
            markerType.options[0].text = text('infoPoint');
            markerType.options[1].text = text('jumpPoint');
        }

            const targetScene = projectScenes.find(s => s.id == editingSceneId);
            if (targetScene) {
                document.getElementById('dynamicSceneLabel').innerText = (targetScene.is_group || targetScene.parent_id == null) ? text('currentMainName') : text('currentSubName');

            document.getElementById('dynamicSceneLabel').innerText = text('currentMainName');

    function getActiveGalleryView() {
        return document.getElementById('navMyWorks').classList.contains('active') ? 'myWorks' : 'gallery';
    }

    document.getElementById('langSelect').addEventListener('change', () => {
        localStorage.setItem('panoLang', getLang());
        applyLanguage();
        if (document.getElementById('galleryView').style.display !== 'none') {
            window.loadGalleryData(getActiveGalleryView());
        }
    });

    const savedLang = localStorage.getItem('panoLang');
    if (savedLang && i18n[savedLang]) document.getElementById('langSelect').value = savedLang;

    window.switchView = (viewName) => {
        document.getElementById('navGallery').classList.remove('active');
        document.getElementById('navMyWorks').classList.remove('active');
        document.getElementById('navEditor').classList.remove('active');

        if (viewName === 'gallery' || viewName === 'myWorks') {
            document.getElementById(viewName === 'gallery' ? 'navGallery' : 'navMyWorks').classList.add('active');
            document.getElementById('editorView').style.display = 'none';
            document.getElementById('galleryView').style.display = 'block';

            window.loadGalleryData(viewName);

            if (viewer) {
                try {
                    viewer.destroy();
                } catch(e) {}
                viewer = null;
            }
            resetEditorState();
        } else if (viewName === 'editor') {
            document.getElementById('navEditor').classList.add('active');
            document.getElementById('galleryView').style.display = 'none';
            document.getElementById('editorView').style.display = 'flex';
        }
    };

    window.loadGalleryData = async (viewType) => {
        const gallery = document.getElementById('gallery');
        const t = i18n[getLang()];
        gallery.innerHTML = `<p class="loading-msg">正在加载...</p>`;

        try {
            const url = viewType === 'myWorks' ? `/api/my-scenes?ownerId=${ownerId}` : '/api/scenes';
            const res = await fetch(url);
            const data = await res.json();

            if(!data.success || data.scenes.length === 0) {
                gallery.innerHTML = `<p class="loading-msg">暂无作品</p>`;
                return;
            }

            gallery.innerHTML = data.scenes.map(s => {
                const isDraft = !s.title || s.title.includes('新');
                const badgeHtml = isDraft ?
                    `<span class="badge badge-draft">${t.draft}</span>` :
                    `<span class="badge badge-published">${t.published}</span>`;

                const overlayActions = viewType === 'myWorks' ?
                    `<div class="card-overlay-actions">
                        <button class="card-btn btn-edit-card" onclick="event.stopPropagation(); window.loadProjectToEditor(${s.id})">✏️ 编辑</button>
                        <button class="card-btn btn-delete-card" onclick="event.stopPropagation(); window.deleteProjectFromCard(${s.id})">🗑️ 删除</button>
                    </div>` : '';

                return `
                    <div class="card" onclick="window.open('/view.html?id=${s.id}', '_blank')">
                        <div class="card-img-container">
                            <img src="${s.thumb_url || s.image_url}" class="card-img" loading="lazy" decoding="async">
                            ${overlayActions}
                        </div>
                        <div class="card-info">
                            <h3 class="card-title">${s.title || '未命名'}</h3>
                            ${badgeHtml}
                            <p class="card-time">更新时间：${formatTime(s.update_time || s.create_time)}</p>
                        </div>
                    </div>`;
            }).join('');
        } catch (error) {
            gallery.innerHTML = '<p style="color:red;">获取数据失败，请检查后端运行状态</p>';
        }
    };

    window.deleteProjectFromCard = async (id) => {
        if(!confirm("永久删除？")) return;
        await fetch(`/api/scenes/${id}?ownerId=${ownerId}`, { method: 'DELETE' });
        window.loadGalleryData('myWorks');
    }

    async function fetchProjectData(startId) {
        try {
            const r = await fetch(`/api/scenes-tree/${startId}`);

            // 【核心防御】：拦截后端未更新或服务宕机返回的 HTML 报错页
            const contentType = r.headers.get("content-type");
            if (contentType && contentType.includes("text/html")) {
                alert("🚨 严重系统错误：前端请求了新接口，但后端返回了网页！\n请确认 server.js 已保存，并在 PM2 管理器中【先停止，再启动】彻底重启后端服务！");
                window.switchView('myWorks'); // 强制退回主页保护系统
                return;
            }

            const d = await r.json();
            if(d.success) {
                projectScenes = d.scenes;
                projectMainId = d.projectMainId;
                const startScene = projectScenes.find(s => s.id == startId);
                if (startScene) {
                    currentAreaId = (startScene.is_group || startScene.id == projectMainId) ? startScene.id : startScene.parent_id;
                }
            } else {
                alert("加载场景失败: " + (d.error || "未知错误"));
            }
        } catch (e) {
            console.error(e);
            alert("🚨 网络通信彻底崩溃！请检查宝塔 PM2 后台服务是否处于正常运行状态！");
        }
    }

    const getAreas = () => projectScenes.filter(s => s.id == projectMainId || (s.parent_id == projectMainId && s.is_group == 1));
    const getRooms = (areaId) => projectScenes.filter(s => s.parent_id == areaId && s.is_group == 0);

    window.loadProjectToEditor = async (editId) => {
        window.switchView('editor');
        document.getElementById('uploadBox').style.display = 'none';
        document.getElementById('subScenePanel').style.display = 'block';
        await fetchProjectData(editId);
        await window.switchEditScene(editId);
    };

    function resetEditorState() {
        projectMainId = null;
        currentAreaId = null;
        editingSceneId = null;
        projectScenes = [];
        document.getElementById('uploadBox').style.display = 'block';
        document.getElementById('subScenePanel').style.display = 'none';
        document.getElementById('viewer').classList.remove('active');
    }

    window.handleMainUpload = async () => { await doUpload(document.getElementById('mainFileInput').files[0], null, false); };
    window.handleAreaUpload = async () => { await doUpload(document.getElementById('newAreaFileInput').files[0], projectMainId, true); };
    window.handleSubUpload = async () => { await doUpload(document.getElementById('subFileInput').files[0], currentAreaId, false); };

    async function doUpload(file, parentId, isGroup) {
        if (!file) return;
        const formData = new FormData();
        formData.append('image', file);
        formData.append('ownerId', ownerId);

        if (parentId) formData.append('parentId', parentId);
        formData.append('isGroup', isGroup);

        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json().catch(() => null);

        if (!res.ok || !data || !data.success) {
            alert('上传失败：' + (data?.error || res.status));
            return;
        }

        if (data.success) {
            let targetAreaId = currentAreaId;
            if (!parentId) {
                projectMainId = data.sceneId;
                targetAreaId = data.sceneId;
                document.getElementById('uploadBox').style.display = 'none';
                document.getElementById('subScenePanel').style.display = 'block';
            } else if (isGroup) {
                targetAreaId = data.sceneId;
            }

            await fetchProjectData(projectMainId);
            currentAreaId = targetAreaId;
            await window.switchEditScene(data.sceneId);
        }
    }

    window.selectArea = (id) => {
        currentAreaId = id;
        window.switchEditScene(id);
    };

    window.switchEditScene = async (targetId) => {
        editingSceneId = targetId;
        renderSidebarLists();
        window.switchSidebarPanel('props');

        const targetScene = projectScenes.find(s => s.id == targetId);
        document.getElementById('sceneTitle').value = targetScene.title || '';
        document.getElementById('editingName').innerText = targetScene.title;
        // 动态判断当前是主场景还是副场景，并修改上方的 Label 提示
        document.getElementById('dynamicSceneLabel').innerText = (targetScene.is_group || targetScene.parent_id == null) ? text('currentMainName') : text('currentSubName');

        const res = await fetch(`/api/scenes/${targetId}?ownerId=${ownerId}`);
        const data = await res.json();

        const formatted = (data.markers||[]).map(m => {
            let targetName = m.title;
            if (m.target_scene_id) {
                const ts = projectScenes.find(s => s.id == m.target_scene_id);
                if (ts) targetName = ts.title;
            }
            return {
                id: `m-${m.id}`,
                position: { yaw: parseFloat(m.yaw)||0, pitch: parseFloat(m.pitch)||0 },
                html: `
                    <div class="marker-custom-wrapper">
                        <div class="marker-label">${targetName}</div>
                        <div class="${m.target_scene_id ? 'marker-icon-arrow' : 'marker-icon-info'}"></div>
                    </div>`,
                size: { width: 80, height: 50 },
                anchor: 'bottom center',
                tooltip: { content: m.title },
                data: { dbMarkerId: m.id }
            };
        });

        if (viewer) viewer.destroy();

        const oldViewer = document.getElementById('viewer');
        const newViewer = document.createElement('div');
        newViewer.id = 'viewer';
        newViewer.style.cssText = "position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;";
        newViewer.classList.add('active');
        oldViewer.parentNode.replaceChild(newViewer, oldViewer);

        setTimeout(() => {
            viewer = new Viewer({
                container: document.getElementById('viewer'),
                panorama: targetScene.image_url,
                defaultZoomLvl: 0,
                plugins: [ [MarkersPlugin, { markers: formatted }] ]
            });
            markersPlugin = viewer.getPlugin(MarkersPlugin);
            markersPlugin.addEventListener('select-marker', (e, marker) => {
                if(!isPlacingMarkerMode) loadMarkerToProSidebar(marker||e.marker);
            });
        }, 30);
    };

    function renderSidebarLists() {
        document.getElementById('mainSceneList').innerHTML = getAreas().map(s => `
            <div class="thumb-item ${s.id == currentAreaId ? 'active' : ''}" style="overflow:hidden; opacity: ${s.id == currentAreaId ? '1' : '0.5'};" onclick="window.selectArea(${s.id})">
                <img src="${s.thumb_url || s.image_url}" loading="lazy" decoding="async" style="width:100%; height:100%; object-fit:cover;">
                ${s.id != projectMainId ? `<div class="btn-delete-thumb" onclick="event.stopPropagation(); window.deleteScene(${s.id})">×</div>` : ''}
                <span style="background:${s.id == currentAreaId ? 'rgba(52,120,246,0.9)' : 'rgba(0,0,0,0.7)'};">${s.id == projectMainId ? '' : ''}${s.title}</span>
            </div>`).join('');

        document.getElementById('thumbList').innerHTML = getRooms(currentAreaId).map(s => `
            <div class="thumb-item ${s.id == editingSceneId ? 'active' : ''}" style="overflow:hidden;" onclick="window.switchEditScene(${s.id})">
                <img src="${s.thumb_url || s.image_url}" loading="lazy" decoding="async" style="width:100%; height:100%; object-fit:cover;">
                <div class="btn-delete-thumb" onclick="event.stopPropagation(); window.deleteScene(${s.id})">×</div>
                <span>${s.title}</span>
            </div>`).join('');

        document.getElementById('proMarkerTarget').innerHTML = projectScenes.filter(s => s.id != editingSceneId).map(s => `
            <option value="${s.id}">${(s.is_group || s.parent_id == null) ? '[区域] ' : '[房间] '}${s.title}</option>
        `).join('');
    }

    window.saveSceneInfo = async () => {
        const saveBtn = document.querySelector('button[onclick="saveSceneInfo()"]');
        const originalText = saveBtn.innerText;
        saveBtn.innerText = '保存中...';

        await fetch(`/api/scenes/${editingSceneId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: document.getElementById('sceneTitle').value, ownerId })
        });

        let savedArea = currentAreaId;
        await fetchProjectData(projectMainId);
        currentAreaId = savedArea;
        window.switchEditScene(editingSceneId);

        // 【优化】：去掉 alert，改成按钮文字变化提示
        saveBtn.innerText = '已保存 ✓';
        saveBtn.style.backgroundColor = '#10b981'; // 变成绿色
        setTimeout(() => {
            saveBtn.innerText = originalText;
            saveBtn.style.backgroundColor = ''; // 恢复原色
        }, 1500);
    };

    // --- 居中弹窗控制器 ---
    let centerModalCallback = null;

    window.openCenterModal = (title, desc, confirmCallback) => {
        document.getElementById('cmTitle').innerText = title;
        document.getElementById('cmDesc').innerText = desc;
        centerModalCallback = confirmCallback;

        const modal = document.getElementById('centerModal');
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('show'), 10);
    };

    window.closeCenterModal = () => {
        const modal = document.getElementById('centerModal');
        modal.classList.remove('show');
        setTimeout(() => modal.style.display = 'none', 200);
        centerModalCallback = null;
    };

    document.getElementById('cmConfirmBtn').addEventListener('click', () => {
        if (centerModalCallback) centerModalCallback();
        window.closeCenterModal();
    });

    // --- 替换原有的删除场景功能 ---
    window.deleteScene = (id) => {
        // 呼出我们刚才画的居中弹窗
        window.openCenterModal("删除场景", "删除此场景将不可恢复，是否确定删除？", async () => {
            await fetch(`/api/scenes/${id}?ownerId=${ownerId}`, { method: 'DELETE' });
            if (id == projectMainId) {
                window.switchView('myWorks');
                return;
            }
            let savedArea = currentAreaId;
            if (id == currentAreaId) savedArea = projectMainId;
            await fetchProjectData(projectMainId);
            currentAreaId = savedArea;
            window.switchEditScene(currentAreaId);
        });
    };

    // --- 替换原有的放弃制作功能 ---
    window.discardProject = () => {
        if (!projectMainId) {
            window.switchView('myWorks');
            return;
        }
        // 呼出居中弹窗
        window.openCenterModal("放弃项目", "确定要放弃吗？本项目上传的所有照片都将被删除！", async () => {
            await fetch(`/api/scenes/${projectMainId}?ownerId=${ownerId}`, { method: 'DELETE' });
            window.switchView('myWorks');
        });
    };

    // --- 预览模式控制逻辑 ---
    window.enterPreviewMode = () => {
        if (!viewer) return alert('请先上传全景图！');

        window.cancelMarkerEdit();

        // 隐藏不需要的编辑器 UI
        document.getElementById('sidebar').style.display = 'none';
        document.querySelector('.header').style.display = 'none';
        document.getElementById('editingBar').style.display = 'none';

        // 👇 新增这一行：让容器高度变成真正的 100% 满屏
        document.getElementById('editorView').style.height = '100vh';

        // 显示返回按钮
        document.getElementById('exitPreviewBtn').style.display = 'block';

        // 触发自适应以填满全屏
        setTimeout(() => { if (viewer) viewer.resize(); }, 100);
    };

    window.exitPreviewMode = () => {
        // 恢复编辑器 UI
        document.getElementById('sidebar').style.display = 'flex';
        document.querySelector('.header').style.display = 'flex';
        document.getElementById('editingBar').style.display = 'block';

        // 👇 新增这一行：恢复原本减去 70px 导航栏的高度
        document.getElementById('editorView').style.height = 'calc(100vh - 70px)';

        // 隐藏返回按钮
        document.getElementById('exitPreviewBtn').style.display = 'none';

        // 触发自适应以恢复正常大小
        setTimeout(() => { if (viewer) viewer.resize(); }, 100);
    };

    // --- 新增：真·沉浸式预览模式控制逻辑 ---
    window.enterPreviewMode = () => {
        if (!editingSceneId) return alert('请先上传并选中一个场景！');

        window.cancelMarkerEdit(); // 清除可能正在进行的打点状态

        // 1. 获取 iframe 和按钮
        const iframe = document.getElementById('previewIframe');
        const exitBtn = document.getElementById('exitPreviewBtn');

        // 2. 将真实的 view.html 加载到 iframe 中（带上当前正在编辑的场景ID，做到所见即所得）
        iframe.src = `/view.html?id=${editingSceneId}`;

        // 3. 显示全屏 iframe 和退出按钮
        iframe.style.display = 'block';
        exitBtn.style.display = 'block';

        // 注意：底层编辑器的 UI 完全不需要隐藏，因为被 iframe 100% 盖住了，这样就不会产生任何高度错乱和白边问题。
    };

    window.exitPreviewMode = () => {
        const iframe = document.getElementById('previewIframe');
        const exitBtn = document.getElementById('exitPreviewBtn');

        // 1. 隐藏 iframe 和按钮
        iframe.style.display = 'none';
        exitBtn.style.display = 'none';

        // 2. 清空 src 以停止后台渲染，节省浏览器性能
        iframe.src = '';
    };

    // --- 标记交互逻辑 ---
    window.switchSidebarPanel = (p) => {
        const t = document.querySelectorAll('.tab-btn');
        const pr = document.getElementById('propsPanel');
        const m = document.getElementById('markerPanel');

        if (p === 'marker') {
            t[0].classList.remove('active');
            t[1].classList.add('active');
            pr.style.display = 'none';
            m.style.display = 'block';
        } else {
            t[0].classList.add('active');
            t[1].classList.remove('active');
            pr.style.display = 'block';
            m.style.display = 'none';
            window.cancelMarkerEdit();
        }
    }

    window.toggleProMarkerFields = () => {
        document.getElementById('proMarkerFieldDesc').style.display = document.getElementById('proMarkerType').value === 'arrow' ? 'none' : 'block';
        document.getElementById('proMarkerFieldTarget').style.display = document.getElementById('proMarkerType').value === 'arrow' ? 'block' : 'none';
    }

    window.enableMarkerPlacement = () => {
        window.cancelMarkerEdit();
        isPlacingMarkerMode = true;
        document.getElementById('placementTip').style.display = 'block';
        viewer.addEventListener('click', onViewerClickPlacement);
    }

    function onViewerClickPlacement(e) {
        tempMarkerPos = e.data;
        if(!tempMarkerPos) return;

        if (!currentlyEditingMarkerData || !currentlyEditingMarkerData.isNew) {
            currentlyEditingMarkerData = { isNew: true };
            document.getElementById('markerDefaultState').style.display = 'none';
            document.getElementById('markerEditState').style.display = 'block';
            document.getElementById('btnDeleteMarker').style.display = 'none';
            document.getElementById('proMarkerTitle').value='';
            document.getElementById('proMarkerDesc').value='';

            try { markersPlugin.removeMarker('temp-marker'); } catch(err) {}

            markersPlugin.addMarker({
                id: 'temp-marker',
                position: { yaw: tempMarkerPos.yaw, pitch: tempMarkerPos.pitch },
                html: `
                    <div class="marker-custom-wrapper marker-temp">
                        <div class="marker-label">放置中...</div>
                        <div class="marker-icon-temp"></div>
                    </div>`,
                size: { width: 80, height: 50 },
                anchor: 'bottom center'
            });
        } else {
            try {
                markersPlugin.updateMarker({
                    id: 'temp-marker',
                    position: { yaw: tempMarkerPos.yaw, pitch: tempMarkerPos.pitch }
                });
            } catch(err) {}
        }
    }

    function loadMarkerToProSidebar(marker) {
        const mData = marker.data.dbMarkerId;
        fetch(`/api/scenes/${editingSceneId}?ownerId=${ownerId}`)
            .then(r => r.json())
            .then(d => {
                const dbData = d.markers.find(m => m.id == mData);
                if(dbData){
                    window.cancelMarkerEdit();
                    window.switchSidebarPanel('marker');
                    currentlyEditingMarkerData = { isNew: false, dbData, markerIdOnCanvas: marker.id };
                    document.getElementById('markerDefaultState').style.display = 'none';
                    document.getElementById('markerEditState').style.display = 'block';
                    document.getElementById('btnDeleteMarker').style.display = 'block';
                    document.getElementById('proMarkerType').value = dbData.target_scene_id ? 'arrow' : 'info';
                    window.toggleProMarkerFields();
                    document.getElementById('proMarkerTitle').value = dbData.title;
                    document.getElementById('proMarkerDesc').value = dbData.description || '';
                    document.getElementById('proMarkerTarget').value = dbData.target_scene_id || '';
                }
            });
    }

    window.cancelMarkerEdit = () => {
        isPlacingMarkerMode = false;
        if (viewer) try { viewer.removeEventListener('click', onViewerClickPlacement); } catch(e){}
        if (markersPlugin) try { markersPlugin.removeMarker('temp-marker'); } catch(e) {}

        document.getElementById('placementTip').style.display = 'none';
        document.getElementById('markerDefaultState').style.display = 'block';
        document.getElementById('markerEditState').style.display = 'none';
        currentlyEditingMarkerData = null;
        tempMarkerPos = null;
    }

    window.saveMarkerPro = async () => {
        if(!currentlyEditingMarkerData) return;

        const isArrow = document.getElementById('proMarkerType').value === 'arrow';
        const title = document.getElementById('proMarkerTitle').value;
        if(!title) return alert('必填标题！');

        let posToSave = tempMarkerPos;
        if (!currentlyEditingMarkerData.isNew) {
            posToSave = { yaw: currentlyEditingMarkerData.dbData.yaw, pitch: currentlyEditingMarkerData.dbData.pitch };
            await fetch(`/api/markers/${currentlyEditingMarkerData.dbData.id}`, { method: 'DELETE' });
        }

        const newMarkerData = {
            yaw: posToSave.yaw,
            pitch: posToSave.pitch,
            title,
            description: isArrow ? "" : document.getElementById('proMarkerDesc').value,
            target_scene_id: isArrow ? document.getElementById('proMarkerTarget').value : null,
            ownerId
        };

        const res = await fetch(`/api/scenes/${editingSceneId}/markers`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newMarkerData)
        });

        const data = await res.json();
        if (data.success) {
            window.cancelMarkerEdit();
            window.switchEditScene(editingSceneId);
            window.switchSidebarPanel('props');
        }
    };

    window.deleteMarkerPro = async () => {
        await fetch(`/api/markers/${currentlyEditingMarkerData.dbData.id}`, { method: 'DELETE' });
        window.cancelMarkerEdit();
        window.switchEditScene(editingSceneId);
    }

    window.loadGalleryData = async (viewType) => {
        const gallery = document.getElementById('gallery');
        const t = i18n[getLang()];
        gallery.innerHTML = `<p class="loading-msg">${t.loading}</p>`;

        try {
            const url = viewType === 'myWorks' ? `/api/my-scenes?ownerId=${ownerId}` : '/api/scenes';
            const res = await fetch(url);
            const data = await res.json();

            if (!data.success || data.scenes.length === 0) {
                gallery.innerHTML = `<p class="loading-msg">${t.empty}</p>`;
                return;
            }

            gallery.innerHTML = data.scenes.map(s => {
                const isDraft = !s.title || s.title.includes('新') || s.title.includes('鏂');
                const badgeHtml = isDraft
                    ? `<span class="badge badge-draft">${t.draft}</span>`
                    : `<span class="badge badge-published">${t.published}</span>`;
                const overlayActions = viewType === 'myWorks'
                    ? `<div class="card-overlay-actions">
                        <button class="card-btn btn-edit-card" onclick="event.stopPropagation(); window.loadProjectToEditor(${s.id})">${t.edit}</button>
                        <button class="card-btn btn-delete-card" onclick="event.stopPropagation(); window.deleteProjectFromCard(${s.id})">${t.delete}</button>
                    </div>`
                    : '';

                return `
                    <div class="card" onclick="window.open('/view.html?id=${s.id}', '_blank')">
                        <div class="card-img-container">
                            <img src="${s.thumb_url || s.image_url}" class="card-img" loading="lazy" decoding="async">
                            ${overlayActions}
                        </div>
                        <div class="card-info">
                            <h3 class="card-title">${s.title || t.unnamed}</h3>
                            ${badgeHtml}
                            <p class="card-time">${t.updatedAt}${formatDisplayTime(s.update_time || s.create_time)}</p>
                        </div>
                    </div>`;
            }).join('');
        } catch (error) {
            gallery.innerHTML = `<p style="color:red;">${t.fetchFailed}</p>`;
        }
    };

    window.deleteProjectFromCard = async (id) => {
        if (!confirm(text('confirmDeleteProject'))) return;
        await fetch(`/api/scenes/${id}?ownerId=${ownerId}`, { method: 'DELETE' });
        window.loadGalleryData('myWorks');
    };

    renderSidebarLists = function() {
        document.getElementById('mainSceneList').innerHTML = getAreas().map(s => `
            <div class="thumb-item ${s.id == currentAreaId ? 'active' : ''}" style="overflow:hidden; opacity: ${s.id == currentAreaId ? '1' : '0.5'};" onclick="window.selectArea(${s.id})">
                <img src="${s.thumb_url || s.image_url}" loading="lazy" decoding="async" style="width:100%; height:100%; object-fit:cover;">
                ${s.id != projectMainId ? `<div class="btn-delete-thumb" onclick="event.stopPropagation(); window.deleteScene(${s.id})">×</div>` : ''}
                <span style="background:${s.id == currentAreaId ? 'rgba(52,120,246,0.9)' : 'rgba(0,0,0,0.7)'};">${s.title}</span>
            </div>`).join('');

        document.getElementById('thumbList').innerHTML = getRooms(currentAreaId).map(s => `
            <div class="thumb-item ${s.id == editingSceneId ? 'active' : ''}" style="overflow:hidden;" onclick="window.switchEditScene(${s.id})">
                <img src="${s.thumb_url || s.image_url}" loading="lazy" decoding="async" style="width:100%; height:100%; object-fit:cover;">
                <div class="btn-delete-thumb" onclick="event.stopPropagation(); window.deleteScene(${s.id})">×</div>
                <span>${s.title}</span>
            </div>`).join('');

        document.getElementById('proMarkerTarget').innerHTML = projectScenes.filter(s => s.id != editingSceneId).map(s => `
            <option value="${s.id}">${(s.is_group || s.parent_id == null) ? text('areaPrefix') : text('roomPrefix')}${s.title}</option>
        `).join('');
    };

    window.saveSceneInfo = async () => {
        const saveBtn = document.querySelector('button[onclick="saveSceneInfo()"]');
        const originalText = text('save');
        saveBtn.innerText = text('saving');

        await fetch(`/api/scenes/${editingSceneId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: document.getElementById('sceneTitle').value, ownerId })
        });

        let savedArea = currentAreaId;
        await fetchProjectData(projectMainId);
        currentAreaId = savedArea;
        window.switchEditScene(editingSceneId);

        saveBtn.innerText = text('saved');
        saveBtn.style.backgroundColor = '#10b981';
        setTimeout(() => {
            saveBtn.innerText = originalText;
            saveBtn.style.backgroundColor = '';
        }, 1500);
    };

    window.deleteScene = (id) => {
        window.openCenterModal(text('deleteSceneTitle'), text('deleteSceneDesc'), async () => {
            await fetch(`/api/scenes/${id}?ownerId=${ownerId}`, { method: 'DELETE' });
            if (id == projectMainId) {
                window.switchView('myWorks');
                return;
            }
            let savedArea = currentAreaId;
            if (id == currentAreaId) savedArea = projectMainId;
            await fetchProjectData(projectMainId);
            currentAreaId = savedArea;
            window.switchEditScene(currentAreaId);
        });
    };

    window.discardProject = () => {
        if (!projectMainId) {
            window.switchView('myWorks');
            return;
        }
        window.openCenterModal(text('discardTitle'), text('discardDesc'), async () => {
            await fetch(`/api/scenes/${projectMainId}?ownerId=${ownerId}`, { method: 'DELETE' });
            window.switchView('myWorks');
        });
    };

    applyLanguage();
    window.switchView('gallery');

</script>
<div class="center-modal-overlay" id="centerModal">
    <div class="center-modal-box">
        <div class="center-modal-header" id="cmTitle">确认操作</div>
        <div class="center-modal-body" id="cmDesc">你确定要执行此操作吗？</div>
        <div class="center-modal-footer">
            <button class="pro-btn btn-outline" style="width: 100px; margin: 0;" onclick="closeCenterModal()">取消</button>
            <button class="pro-btn btn-danger" style="width: 100px; margin: 0;" id="cmConfirmBtn">确定删除</button>
        </div>
    </div>
</div>
</body>
</html>
